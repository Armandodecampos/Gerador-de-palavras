<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Palavra Aleatória Dinâmica</title>
    <!-- Carrega Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração do Tailwind para usar a fonte Inter e cores personalizadas -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#8A2BE2', // Roxo
                        'secondary': '#40E0D0', // Turquesa
                        'accent': '#FF00FF', // Magenta
                    }
                }
            }
        }
    </script>
    <style>
        /* Define a fonte Inter para o corpo do documento */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animações */
        .slide-in-up {
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-dots span {
            animation: growAndShrink 1.2s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes growAndShrink {
            0%, 100% {
                transform: scale(0.8);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white/10 backdrop-blur-lg p-8 md:p-10 rounded-xl shadow-2xl transition-all duration-300 border border-white/20">

        <!-- Área de Exibição da Palavra -->
        <div class="min-h-[150px] flex items-center justify-center bg-black/20 rounded-lg mb-4 p-4 shadow-inner">
            <p id="wordDisplay" class="text-5xl md:text-7xl font-extrabold text-white text-center">
                Clique para começar!
            </p>
        </div>
        
        <!-- Área de Exibição da Definição -->
        <div id="definitionContainer" class="min-h-[100px] bg-black/20 rounded-lg p-4 mb-8 border border-white/20 opacity-0" style="transition: opacity 0.5s ease-in-out;">
            <div id="definitionDisplay" class="text-white/80 text-lg">
                A definição aparecerá aqui.
            </div>
            <div id="loadingIndicator" class="hidden flex items-center justify-center text-white font-medium">
                <div class="loading-dots flex space-x-2">
                    <span class="w-3 h-3 bg-accent rounded-full"></span>
                    <span class="w-3 h-3 bg-accent rounded-full"></span>
                    <span class="w-3 h-3 bg-accent rounded-full"></span>
                </div>
                <span class="ml-4">A carregar...</span>
            </div>
        </div>

        <!-- Seletor de Dificuldade -->
        <div class="mb-4">
            <label for="difficultySelector" class="block text-white text-sm font-bold mb-2">Nível de Dificuldade:</label>
            <select id="difficultySelector" class="block w-full bg-black/20 text-white border border-white/20 rounded-lg py-3 px-4 focus:outline-none focus:border-accent">
                <option value="any">Qualquer</option>
                <option value="easy">Fácil (4-6 letras)</option>
                <option value="medium">Intermediário (7-10 letras)</option>
            </select>
        </div>

        <!-- Botão de Geração -->
        <button id="generateButton"
            class="w-full bg-primary text-white py-4 px-6 rounded-lg font-bold text-xl shadow-lg shadow-primary/40
                   hover:bg-secondary hover:shadow-secondary/50 transition-all duration-300 transform hover:scale-[1.03] active:scale-95
                   focus:outline-none focus:ring-4 focus:ring-accent/50">
            Gerar Palavra
        </button>

        <!-- Área de Histórico de Palavras -->
        <div class="mt-8 text-center">
            <h3 class="text-lg font-semibold text-white mb-3">Histórico da Sessão</h3>
            <div id="historyDisplay" class="flex flex-wrap justify-center gap-2 text-sm text-white/80">
                <!-- Palavras geradas aparecerão aqui -->
            </div>
        </div>

    </div>

    <script>
        
        const wordDisplay = document.getElementById('wordDisplay');
        const definitionDisplay = document.getElementById('definitionDisplay');
        const definitionContainer = document.getElementById('definitionContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const generateButton = document.getElementById('generateButton');
        const historyDisplay = document.getElementById('historyDisplay');
        const difficultySelector = document.getElementById('difficultySelector');

        let definitionAbortController = new AbortController();
        const generatedWordsHistory = new Set();

        function parseDefinitionFromXML(xml) {
            const gramGrpMatch = xml.match(/<gramGrp>(.*?)<\/gramGrp>/);
            const defMatch = xml.match(/<def>([\s\S]*?)<\/def>/);

            const gramGrp = gramGrpMatch ? gramGrpMatch[1].trim() + ':' : '';
            let def = defMatch ? defMatch[1].trim() : "Definição não encontrada.";

            // Remove tags HTML e formatações extras da definição
            def = def.replace(/<[^>]*>/g, '').replace(/\[\[(.*?)\]\]/g, '$1');

            return { gramGrp, def };
        }

        async function fetchWordAndDefinition(signal, usedWords, difficulty) {
            const maxAttempts = 20; // Aumenta o número de tentativas para encontrar uma palavra adequada
            for (let i = 0; i < maxAttempts; i++) {
                // 1. Obter uma palavra aleatória
                const randomResponse = await fetch('https://api.dicionario-aberto.net/random', { signal });
                if (!randomResponse.ok) throw new Error('Falha ao buscar palavra aleatória.');
                const randomData = await randomResponse.json();
                const word = randomData.word;

                // 2. Verificar se a palavra já foi usada
                if (usedWords.has(word.toLowerCase())) {
                    console.log(`Palavra repetida "${word}", tentando novamente...`);
                    continue;
                }

                // 3. Aplicar filtro de dificuldade
                const wordLength = word.length;
                if (difficulty === 'easy' && (wordLength < 4 || wordLength > 6)) {
                    console.log(`Palavra "${word}" não passou no filtro "Fácil" (${wordLength} letras), tentando novamente...`);
                    continue;
                }
                if (difficulty === 'medium' && (wordLength < 7 || wordLength > 10)) {
                    console.log(`Palavra "${word}" não passou no filtro "Intermediário" (${wordLength} letras), tentando novamente...`);
                    continue;
                }

                // 4. Obter a definição da palavra
                const definitionResponse = await fetch(`https://api.dicionario-aberto.net/word/${word}`, { signal });
                if (!definitionResponse.ok) {
                    console.warn(`Falha ao buscar definição para "${word}", tentando com outra palavra.`);
                    continue;
                }
                const definitionData = await definitionResponse.json();

                // 5. Processar e retornar a primeira definição encontrada
                if (definitionData && definitionData.length > 0 && definitionData[0].xml) {
                    const { gramGrp, def } = parseDefinitionFromXML(definitionData[0].xml);
                    return { palavra: word, definicao: `${gramGrp} ${def}` };
                }
            }
            throw new Error('Não foi possível encontrar uma nova palavra com o filtro selecionado após várias tentativas.');
        }

        function updateHistoryDisplay() {
            historyDisplay.innerHTML = ''; // Limpa o histórico atual
            const words = Array.from(generatedWordsHistory);
            words.forEach(word => {
                const wordElement = document.createElement('span');
                wordElement.className = 'bg-black/20 text-white/90 px-3 py-1 rounded-full';
                wordElement.textContent = word;
                historyDisplay.appendChild(wordElement);
            });
        }

        async function displayRandomWord() {
            definitionAbortController.abort();
            definitionAbortController = new AbortController();
            const { signal } = definitionAbortController;

            generateButton.disabled = true;
            generateButton.classList.add('opacity-50', 'cursor-not-allowed');
            loadingIndicator.classList.remove('hidden');
            definitionDisplay.classList.add('hidden');
            definitionContainer.style.opacity = '1';

            wordDisplay.textContent = '';

            try {
                const difficulty = difficultySelector.value;
                const { palavra: cleanedWord, definicao: definition } = await fetchWordAndDefinition(signal, generatedWordsHistory, difficulty);
                if (!cleanedWord || !definition) throw new Error("A resposta da API não contém a palavra ou a definição.");

                generatedWordsHistory.add(cleanedWord.toLowerCase());
                updateHistoryDisplay();

                wordDisplay.textContent = cleanedWord.toUpperCase();
                wordDisplay.classList.add('slide-in-up');

                const parts = definition.match(/(\w+\.:?)(.*)/s);
                definitionDisplay.innerHTML = parts && parts.length === 3
                    ? `<span class="text-accent font-semibold">${parts[1]}</span> ${parts[2].trim()}`
                    : definition;
                
                definitionDisplay.classList.remove('hidden');
                definitionDisplay.classList.add('slide-in-up');

            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error("Erro no fluxo principal:", error);
                wordDisplay.textContent = 'ERRO';
                definitionDisplay.innerHTML = `<span class="font-bold text-red-400">Erro:</span> ${error.message}.`;
                definitionDisplay.classList.remove('hidden');
            } finally {
                generateButton.disabled = false;
                generateButton.classList.remove('opacity-50', 'cursor-not-allowed');
                loadingIndicator.classList.add('hidden');
                wordDisplay.addEventListener('animationend', () => wordDisplay.classList.remove('slide-in-up'), { once: true });
                definitionDisplay.addEventListener('animationend', () => definitionDisplay.classList.remove('slide-in-up'), { once: true });
            }
        }

        generateButton.addEventListener('click', displayRandomWord);
    </script>
</body>
</html>
