<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Palavra Aleatória Dinâmica</title>
    <!-- Carrega Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração do Tailwind para usar a fonte Inter e cores personalizadas -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#4f46e5', // Indigo-600
                        'secondary': '#eef2ff', // Indigo-50
                        'accent': '#10b981', // Emerald-500
                    }
                }
            }
        }
    </script>
    <style>
        /* Define a fonte Inter para o corpo do documento */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Gray-50 */
        }
        /* Estilo para a animação de fade-in da palavra */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Esconde o scrollbar em alguns navegadores, se o histórico for muito grande */
        #historyDisplay {
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white p-8 md:p-10 rounded-xl shadow-2xl transition-all duration-300 hover:shadow-primary/30 border border-indigo-100">


        <!-- Área de Exibição da Palavra -->
        <div class="min-h-[150px] flex items-center justify-center bg-secondary rounded-lg mb-4 p-4 shadow-inner">
            <p id="wordDisplay" class="text-4xl md:text-6xl font-black text-primary text-center transition-all duration-300">
                Clique para começar!
            </p>
        </div>
        
        <!-- Área de Exibição da Definição -->
        <div class="min-h-[100px] bg-gray-50 rounded-lg p-4 mb-8 border border-gray-200">
            <h2 class="text-xl font-bold text-gray-700 mb-2">Definição:</h2>
            <div id="definitionDisplay" class="text-gray-600 text-base italic">
                A definição aparecerá aqui após a geração da palavra.
            </div>
            <div id="loadingIndicator" class="hidden flex items-center justify-center text-primary font-medium">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                A carregar palavra e definição...
            </div>
            <!-- Texto removido conforme solicitado -->
            <div id="authStatus" class="text-xs text-accent mt-2 text-center"></div>
        </div>


        <!-- Botão de Geração -->
        <button id="generateButton"
            class="w-full bg-primary text-white py-3 px-6 rounded-lg font-semibold text-lg shadow-lg shadow-primary/40 
                   hover:bg-indigo-700 transition-all duration-300 transform hover:scale-[1.01] active:scale-95 
                   focus:outline-none focus:ring-4 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed"
            aria-label="Gerar nova palavra">
            Gerar Palavra
        </button>

        <!-- Área do Cronômetro -->
        <div class="mt-6 text-center">
            <label for="countdownTime" class="block text-sm font-medium text-gray-700 mb-2">Tempo do Cronômetro (segundos):</label>
            <input type="number" id="countdownTime" value="30" min="1"
                   class="w-32 text-center border-gray-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
            <p class="text-2xl font-bold text-gray-800 mt-2" id="timerDisplay">00:30</p>
        </div>
        <audio id="startSound" src="https://sounds.sfxengine.com/user-arrived-notification-jitz3gzq.wav"></audio>
        <audio id="endSound" src="https://sounds.sfxengine.com/a-sound-effect--for-xoq4tmlk.wav"></audio>
        <audio id="countdownBeep" src="https://sounds.sfxengine.com/clock-ticking-7i2dwuts.wav"></audio>

        <!-- Área de Histórico de Palavras -->
        <div class="mt-8 text-center">
            <h3 class="text-lg font-semibold text-gray-700 mb-3">Histórico da Sessão:</h3>
            <div id="historyDisplay" class="flex flex-wrap justify-center gap-2 text-sm text-gray-600">
                <span class="text-gray-400">Nenhuma palavra generada nesta sessão.</span>
            </div>
        </div>
    </div>

    <script>
        
        const wordDisplay = document.getElementById('wordDisplay');
        const definitionDisplay = document.getElementById('definitionDisplay');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const generateButton = document.getElementById('generateButton');
        const historyDisplay = document.getElementById('historyDisplay');
        const authStatus = document.getElementById('authStatus');
        const countdownTimeInput = document.getElementById('countdownTime');
        const timerDisplay = document.getElementById('timerDisplay');
        const startSound = document.getElementById('startSound');
        const endSound = document.getElementById('endSound');
        const countdownBeep = document.getElementById('countdownBeep');

        let countdownInterval;

        // Variável para controlar o cancelamento de buscas de definição
        let definitionAbortController = new AbortController();
        // Conjunto para armazenar palavras já geradas APENAS nesta sessão (limpo ao recarregar a página)
        const generatedWordsHistory = new Set();

        /**
         * Gera o prompt do sistema com base em uma abordagem de "Contexto Dinâmico"
         * para aumentar a imprevisibilidade, focando somente em vocabulário português.
         * * Camadas de Aleatoriedade:
         * 1. Semente de Alta Entropia (Timestamp + Random String)
         * 2. Contexto Dinâmico (Ações/Coisas vs. Ideias/Qualidades)
         * 3. Viesamento Gramatical (Tense/Singularity Bias) - PLURAL REMOVIDO
         */
        function buildSystemPrompt(currentTimestamp, randomSeed, wordsToAvoid) {
            
            const coreRule = `
                1. A palavra deve ser preferencialmente um **substantivo comum** (ex: "casa", "livro", "cidade").
                2. A palavra deve ser de **nível básico a intermediário**, de uso comum no português.
                3. Ocasionalmente, para manter a variedade, pode ser gerado um verbo ou adjetivo.
            `;

            const languageBiasInstruction = `
                Garanta que a palavra seja de vocabulário puro do Português, evitando anglicismos ou termos que não sejam de uso comum no idioma.
            `;

            let systemPrompt = `
                Sua tarefa é gerar UMA ÚNICA palavra em português e sua definição.
                Use esta Semente de Aleatoriedade combinada (Timestamp: ${currentTimestamp}, Seed: ${randomSeed}) para garantir que sua escolha seja o mais imprevisível e diversificada possível.
                
                Siga estritamente as seguintes regras:
                ${coreRule.trim()}
                ${languageBiasInstruction.trim()}
                Deve ser de uso comum e cotidiano, com significado amplamente conhecido, e deve **evitar termos de nível avançado** ou jargões.
                3. A definição deve ser concisa, clara e incluir a classificação gramatical (ex: Substantivo, Adjetivo, Verbo, etc.).
                4. Sua resposta DEVE ser um objeto JSON válido.
                5. O objeto deve ter exatamente duas chaves: "palavra" e "definicao".
                6. Não inclua nenhum texto ou formatação fora do objeto JSON.
            `;

            if (wordsToAvoid.length > 0) {
                systemPrompt += `\n7. IMPORTANTE: Não gere nenhuma das seguintes palavras que já foram usadas NESTA SESSÃO: ${wordsToAvoid}.`;
            }

            return systemPrompt.trim();
        }

        // Função para buscar a palavra e sua definição em uma única chamada
        async function fetchWordAndDefinition(signal, usedWords) {
            // Semente de Aleatoriedade (Timestamp e String Aleatória) - Muda a cada milissegundo/chamada
            const currentTimestamp = Date.now();
            const randomSeed = Math.random().toString(36).substring(2); // String de alta entropia
            
            // Converte o Set de palavras usadas em um array para a prompt
            const wordsToAvoid = Array.from(usedWords).join(', ');
            
            const systemPrompt = buildSystemPrompt(currentTimestamp, randomSeed, wordsToAvoid);

            const userQuery = "Gere uma palavra e sua definição em português no formato de objeto JSON.";
            const jsonResponse = await callGeminiApi(systemPrompt, userQuery, signal);

            // O texto da API pode vir com ```json ... ```, vamos limpar isso.
            const cleanedJson = jsonResponse.replace(/```json\n?|\n?```/g, '').trim();
            // Retorna o objeto JSON diretamente
            
            // Validação de JSON: Verifica se a string limpa é uma string não vazia e começa com '{'
            if (!cleanedJson || cleanedJson[0] !== '{') {
                try {
                    // Tenta analisar o texto cru, se for um erro da API (que geralmente não é JSON)
                    throw new Error(`Resposta inválida da API. Conteúdo recebido: "${cleanedJson.substring(0, 50)}..."`);
                } catch (e) {
                    throw new Error(`Resposta da API não é JSON. Erro de análise: ${e.message}`);
                }
            }

            return JSON.parse(cleanedJson);
        }

        // Função genérica para chamar o Gemini API com resiliência e cancelamento
        async function callGeminiApi(systemPrompt, userQuery, signal) {
            const apiKey = "AIzaSyCj1FF-9vyDMIrZ65_ZwnQSqw2VocK__OQ";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                generationConfig: {
                    responseMimeType: "application/json",
                }
            };

            const maxAttempts = 5;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: signal
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text) {
                        return text; // Retorna o texto, a validação JSON será feita fora daqui
                    } else {
                        throw new Error("Resposta da API vazia ou inválida.");
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        // Não registrar AbortError como erro de API
                        throw error;
                    }

                    console.error(`Erro na chamada da API (tentativa ${attempt}/${maxAttempts}):`, error.message);

                    if (attempt === maxAttempts) {
                        throw new Error(`Erro final ao comunicar com o serviço da API. Código: ${error.message}`);
                    }

                    if (error.message.includes('429')) {
                        const delay = Math.pow(2, attempt - 1) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                    } else {
                        const delay = 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
        }

        // Função principal para gerar e exibir a palavra e sua definição
        async function displayRandomWord() {
            // Interrompe qualquer contagem regressiva e som existentes
            clearInterval(countdownInterval);
            countdownBeep.pause();
            countdownBeep.currentTime = 0;

            // 1. Cancelamento e Estado
            definitionAbortController.abort();
            definitionAbortController = new AbortController();
            const signal = definitionAbortController.signal;

            generateButton.disabled = true;
            loadingIndicator.classList.remove('hidden');
            
            // Texto temporário removido aqui.
            definitionDisplay.textContent = ''; 
            definitionDisplay.classList.add('italic', 'text-gray-500');
            wordDisplay.textContent = '...';

            try {
                // 2. Busca a palavra, passando o histórico de sessão (generatedWordsHistory)
                const selectedWord = await fetchWordAndDefinition(signal, generatedWordsHistory);

                if (!selectedWord || typeof selectedWord.palavra !== 'string' || typeof selectedWord.palavra === 'undefined' || typeof selectedWord.definicao !== 'string') {
                    throw new Error("A resposta da API não contém um objeto de palavra válido.");
                }

                const cleanedWord = selectedWord.palavra.trim();
                const definition = selectedWord.definicao.trim();

                // 3. Adiciona a palavra ao histórico da sessão
                generatedWordsHistory.add(cleanedWord.toLowerCase());
                updateHistoryDisplay();

                // 4. Atualiza a UI
                wordDisplay.classList.remove('fade-in');
                void wordDisplay.offsetWidth; // Gatilho de reflow para reiniciar a animação
                wordDisplay.textContent = cleanedWord.toUpperCase();
                wordDisplay.classList.add('fade-in');

                startCountdown();

                // Tenta formatar a definição para destacar a classe gramatical
                const parts = definition.match(/(\w+:)(.*)/s);
                if (parts && parts.length === 3) {
                    const classification = `<span class="text-accent font-semibold">${parts[1]}</span>`;
                    const defText = parts[2].trim();
                    definitionDisplay.innerHTML = `${classification} ${defText}`;
                } else {
                    definitionDisplay.textContent = definition;
                }
                
                definitionDisplay.classList.remove('italic', 'text-gray-500', 'text-red-500');
                definitionDisplay.classList.add('text-gray-900', 'font-normal');

            } catch (error) {
                if (error.name === 'AbortError') {
                    return;
                }
                console.error("Erro no fluxo principal:", error);
                wordDisplay.textContent = 'ERRO';
                definitionDisplay.innerHTML = `<span class="font-bold text-red-600">Erro:</span> Falha ao gerar palavra ou comunicar com a API.
                                              <br> Detalhe: ${error.message}.`;
                definitionDisplay.classList.remove('text-gray-900', 'font-normal');
                definitionDisplay.classList.add('italic', 'text-red-500');
            } finally {
                generateButton.disabled = false;
                loadingIndicator.classList.add('hidden');
            }
        }

        // Função para atualizar a exibição do histórico
        function updateHistoryDisplay() {
            historyDisplay.innerHTML = ''; // Limpa o histórico atual
            const words = Array.from(generatedWordsHistory);

            if (words.length === 0) {
                 historyDisplay.innerHTML = '<span class="text-gray-400">Nenhuma palavra generada nesta sessão.</span>';
            } else {
                words.forEach(word => {
                    const wordElement = document.createElement('span');
                    wordElement.className = 'bg-gray-200 text-gray-800 px-2 py-1 rounded-full';
                    wordElement.textContent = word;
                    historyDisplay.appendChild(wordElement);
                });
            }
        }

        // Inicialização: a exibição do histórico é atualizada uma vez ao carregar.
        updateHistoryDisplay(); 
        
        // Adicionar o listener ao botão
        generateButton.addEventListener('click', displayRandomWord);

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function startCountdown() {
            clearInterval(countdownInterval);

            let timeRemaining = parseInt(countdownTimeInput.value, 10);
            if (isNaN(timeRemaining) || timeRemaining <= 0) {
                timeRemaining = 30;
            }

            timerDisplay.textContent = formatTime(timeRemaining);
            startSound.play();

            countdownInterval = setInterval(() => {
                timeRemaining--;
                timerDisplay.textContent = formatTime(timeRemaining);

                if (timeRemaining <= 5 && timeRemaining > 0) {
                    countdownBeep.currentTime = 0; // Reinicia o som para garantir que toque a cada segundo
                    countdownBeep.play();
                }

                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownBeep.pause();
                    countdownBeep.currentTime = 0;
                    endSound.play();
                }
            }, 1000);
        }
    </script>
</body>
</html>
